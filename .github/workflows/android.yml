name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (JVM)
        run: ./gradlew -p core test

      - name: App unit tests, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Release APK with R8 (signed with the debug key, for phone testing)
        run: ./gradlew :app:assembleR8test

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: czytnik-glosowy-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload R8 test APK
        uses: actions/upload-artifact@v4
        with:
          name: czytnik-glosowy-r8test-${{ env.SHORT_SHA }}
          path: |
            app/build/outputs/apk/r8test/*.apk
            app/build/outputs/mapping/r8test/mapping.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ env.SHORT_SHA }}
          path: |
            core/build/reports/
            app/build/reports/
          retention-days: 14
